apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-classifier
  labels:
    app: document-classifier

spec:
  replicas: 1

  selector:
    matchLabels:
      app: document-classifier

  template:
    metadata:
      labels:
        app: document-classifier

    spec:
      containers:
        - name: document-classifier
          image: enterpisedocacr.azurecr.io/document-classifier-api:1.0

          ports:
            - containerPort: 8000

          env:
            - name: DOCUMENT_INTELLIGENCE_KEY
              valueFrom:
                secretKeyRef:
                  name: document-intelligence-secret
                  key: DOCUMENT_INTELLIGENCE_KEY

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1000m"
              memory: "1Gi"

---

apiVersion: v1
kind: Service
metadata:
  name: document-classifier-service

spec:
  type: LoadBalancer

  selector:
    app: document-classifier

  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000