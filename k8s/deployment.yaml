
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-classifier
  labels:
    app: document-classifier

spec:
  replicas: 1

  selector:
    matchLabels:
      app: document-classifier

  template:
    metadata:
      labels:
        app: document-classifier

    spec:
      containers:
        - name: document-classifier
          image: enterprisedocacr1.azurecr.io/doc-classifier-api:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # Load application credentials from Kubernetes Secret
          envFrom:
            - secretRef:
                name: document-intelligence-secret

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1000m"
              memory: "1Gi"

---

apiVersion: v1
kind: Service
metadata:
  name: document-classifier-service
  labels:
    app: document-classifier

spec:
  type: LoadBalancer

  selector:
    app: document-classifier

  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
